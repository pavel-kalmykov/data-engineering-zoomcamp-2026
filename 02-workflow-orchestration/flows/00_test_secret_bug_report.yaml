id: 00_test_secret
namespace: zoomcamp

description: Test flow to debug GEMINI_API_KEY secret - Return task mysteriously fails with no error message

tasks:
  - id: check_secret
    type: io.kestra.plugin.core.debug.Return
    format: |
      Testing secret access...
      Secret exists: {{ secret('GEMINI_API_KEY') is not null }}
      Secret is empty: {{ secret('GEMINI_API_KEY') is empty }}
      Secret first 4 chars: {{ secret('GEMINI_API_KEY') | slice(0, 4) }}
      Secret length: {{ secret('GEMINI_API_KEY') | length }}
      Secret equals asterisks: {{ secret('GEMINI_API_KEY') == '******' }}

  - id: bash_check
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - echo "Environment variable SECRET_GEMINI_API_KEY length:"
      - echo -n "$SECRET_GEMINI_API_KEY" | wc -c
      - echo "First 10 chars:"
      - echo "$SECRET_GEMINI_API_KEY" | cut -c1-10
