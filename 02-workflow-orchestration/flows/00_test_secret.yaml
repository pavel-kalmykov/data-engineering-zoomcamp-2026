id: 00_test_secret
namespace: zoomcamp

description: Test flow to debug GEMINI_API_KEY secret

tasks:
  - id: write_secret_to_file
    type: io.kestra.plugin.scripts.shell.Commands
    outputFiles:
      - "*.txt"
    commands:
      - echo "{{ secret('GEMINI_API_KEY') }}" > secret_value.txt
      - echo "Length:" >> secret_value.txt
      - echo "{{ secret('GEMINI_API_KEY') }}" | wc -c >> secret_value.txt
      - echo "First 10 chars:" >> secret_value.txt
      - echo "{{ secret('GEMINI_API_KEY') }}" | cut -c1-10 >> secret_value.txt
      - cat secret_value.txt
